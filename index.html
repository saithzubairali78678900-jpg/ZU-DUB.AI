    <script>
      // Prevent browser extensions from breaking on window.fetch getter-only restriction
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return currentFetch; },
            set: function(fn) { currentFetch = fn; }
          });
        } catch (e) {}

        // Prevent uncaught errors injected by third-party browser extensions or WebSocket disconnects from halting UI
        window.addEventListener('error', function(e) {
          if (e && e.filename && (e.filename.indexOf('chrome-extension://') !== -1 || e.filename.indexOf('moz-extension://') !== -1)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('websocket') !== -1)) {
            e.preventDefault();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason) {
            var msg = (typeof e.reason === 'string' ? e.reason : e.reason.message) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
              e.preventDefault();
              return false;
            }
          }
        });
      })();
    </script>
